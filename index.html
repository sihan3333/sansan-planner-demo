    }
    chips.push('今晚不去散步了，改成复习一小时');
    var wrap = $('aiChips');
    wrap.innerHTML = '';
    chips.forEach(function(t){
      var c = document.createElement('button');
      c.type = 'button'; c.className = 'ai-chip'; c.textContent = t;
      c.addEventListener('click', function(){ $('aiInput').value = t; runAi(t); });
      wrap.appendChild(c);
    });
    if(isViewingToday()){
      var r = document.createElement('button');
      r.type = 'button'; r.className = 'ai-chip strong'; r.textContent = '⟳ 没做完的往后排';
      r.addEventListener('click', function(){ runAi('把今天没做完的往后排', [{op:'replan'}]); });
      wrap.appendChild(r);
    }
  }

  function runAi(text, presetOps){
    text = (text||'').trim();
    if(!text){ aiStatus('先说一句或者打几个字，比如「下午加两小时工作」。', true); return; }
    if(state.view!=='day') return;
    var key = dateKey(state.selectedDate);
    var list = getDayActivities(key);
    var today = isViewingToday();
    var ctx = {isToday:today, now:nowMin(), from: today ? ceil5(nowMin()) : 0};

    var t0 = Date.now();
    function finish(ops, reply, source){
      $('aiSend').disabled = false;
      track('ai_request', {text:text, source:source, n_ops:ops.length, ops:ops.slice(0,10), reply:reply||'', latency_ms:Date.now()-t0});
      if(!ops.length){
        track('ai_no_ops', {text:text, source:source, reply:reply||''});
        aiStatus((reply ? reply+' ' : '')+'没找到要改的内容。可以试试「下午三点到五点加个会」「今晚不去散步了」「耽误了半小时」。', true);
        return;
      }
      var plan = buildPlan(list, ops, ctx);
      if(!plan.changes.length && !plan.warnings.length){
        aiStatus('这样改不需要动任何安排。'); return;
      }
      aiStatus('');
      pendingPlan = {key:key, before:list, plan:plan, planId:uid(), text:text, source:source};
      var kinds = {};
      plan.changes.forEach(function(c){ kinds[c.type] = (kinds[c.type]||0)+1; });
      track('plan_shown', {plan_id:pendingPlan.planId, text:text, source:source, n_changes:plan.changes.length, kinds:kinds, warnings:plan.warnings.length});
      showPlan(text, reply, plan, source);
    }

    if(presetOps){ finish(presetOps, '', 'rule'); return; }
    $('aiSend').disabled = true;
    aiStatus('正在理解你的意思…');
    var local = function(note){
      var r = localParse(text, list, ctx);
      finish(r.ops, r.reply, note || 'local');
    };
    if(!AI_ENDPOINT && !sampleAPI){ local(); return; }
    callLLM(buildPrompt(text, list, ctx)).then(function(res){
      var ops = validateOps(res.data, list);
      if(!ops.length){
        // the model answered but found nothing to do: let the local rules have a go, and only call it
        // a fallback if they actually found something — otherwise it's the model's "didn't understand"
        var r = localParse(text, list, ctx);
        if(r.ops.length) finish(r.ops, r.reply, 'local-fallback');
        else finish([], res.data && typeof res.data.reply==='string' ? res.data.reply : '', res.source);
        return;
      }
      finish(ops, res.data && typeof res.data.reply==='string' ? res.data.reply : '', res.source);
    }).catch(function(){ local('local-fallback'); });
  }

  function showPlan(text, reply, plan, source){
    $('planSaid').textContent = '你说：「'+text+'」';
    $('planReply').textContent = reply || '';
    $('planReply').hidden = !reply;
    var wrap = $('planList');
    wrap.innerHTML = '';
    var labels = {add:'新增', move:'调整', shrink:'压缩', remove:'删除', drop:'移出今天'};
    plan.changes.forEach(function(c){
      var row = document.createElement('div');
      row.className = 'plan-row';
      var time = c.type==='add' ? rangeText(c.after[0], c.after[1])
        : (c.after ? '<s>'+rangeText(c.before[0], c.before[1])+'</s> → '+rangeText(c.after[0], c.after[1]) : '<s>'+rangeText(c.before[0], c.before[1])+'</s>');
      row.innerHTML = '<span class="plan-tag '+c.type+'"></span><div class="plan-body"><div class="plan-name"></div><div class="plan-time"></div><div class="plan-note"></div></div>';
      row.querySelector('.plan-tag').textContent = labels[c.type];
      row.querySelector('.plan-name').textContent = c.name;
      row.querySelector('.plan-time').innerHTML = time;
      row.querySelector('.plan-note').textContent = c.note || '';
      row.querySelector('.plan-note').hidden = !c.note;
      wrap.appendChild(row);
    });
    $('planWarn').hidden = !plan.warnings.length;
    $('planWarn').textContent = plan.warnings.join(' ');
    var src = {
      'DeepSeek':'由 DeepSeek 理解你的话', 'Claude':'由 Claude 理解你的话',
      'local':'由本地规则理解你的话（没有连接大模型）', 'local-fallback':'大模型暂时没连上，已改用本地规则理解',
      'rule':'直接按规则重排'
    }[source] || '';
    $('planSource').textContent = src+'；具体时间由固定规则安排：已开始、已完成的和睡觉时间不动；放不下时先压缩运动、护理，再压缩学习，最后才移出重要性低的。';
    $('planApply').hidden = !plan.changes.length;
    $('planOverlay').hidden = false;
  }
  function closePlan(){ $('planOverlay').hidden = true; pendingPlan = null; }
  function cancelPlan(){
    if(pendingPlan) track('plan_cancelled', {plan_id:pendingPlan.planId, text:pendingPlan.text, source:pendingPlan.source, n_changes:pendingPlan.plan.changes.length});
    closePlan();
  }
  // the plan applied most recently — a manual edit soon after it is a quiet sign the AI got something wrong
  var lastApplied = null;
  function noteManualEdit(action, name, id){
    if(!lastApplied || lastApplied.key!==dateKey(state.selectedDate)) return;
    var secs = (Date.now()-lastApplied.at)/1000;
    if(secs > 300){ lastApplied = null; return; }
    track('edit_after_ai', {plan_id:lastApplied.planId, text:lastApplied.text, source:lastApplied.source,
      action:action, name:name, seconds_after:Math.round(secs), touched_ai_item: lastApplied.ids.indexOf(id)>=0});
  }
  $('planCancel').addEventListener('click', cancelPlan);
  $('planOverlay').addEventListener('click', function(e){ if(e.target===$('planOverlay')) cancelPlan(); });
  $('planApply').addEventListener('click', function(){
    if(!pendingPlan) return;
    var p = pendingPlan, before = p.before;
    track('plan_applied', {plan_id:p.planId, text:p.text, source:p.source, n_changes:p.plan.changes.length});
    lastApplied = {planId:p.planId, text:p.text, source:p.source, key:p.key, at:Date.now(),
                   ids:p.plan.changes.map(function(c){ return c.id; }).filter(Boolean)};
    state.days[p.key] = p.plan.list;
    saveDays(state.days);
    aiFlashIds = {};
    p.plan.changes.forEach(function(c){ if(c.id) aiFlashIds[c.id] = true; });
    closePlan();
    $('aiInput').value = '';
    render();
    setTimeout(function(){ aiFlashIds = {}; }, 2500);
    var appliedAt = Date.now();
    showToast('已调整 '+p.plan.changes.length+' 项', {label:'撤销', fn:function(){
      track('plan_undone', {plan_id:p.planId, text:p.text, source:p.source, seconds_after:Math.round((Date.now()-appliedAt)/1000)});
      if(lastApplied && lastApplied.planId===p.planId) lastApplied = null;
      state.days[p.key] = before; saveDays(state.days); aiFlashIds = {}; render();
    }});
  });
  $('aiSend').addEventListener('click', function(){ runAi($('aiInput').value); });
  $('aiInput').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); runAi($('aiInput').value); } });

  // 语音：浏览器自带的语音识别（Chrome / Edge），说完自动开始理解
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null, recognizing = false, heard = '';
  if(Recognition){
    try{
      recog = new Recognition();
      recog.lang = 'zh-CN';
      recog.continuous = false;
      recog.interimResults = true;
      recog.onresult = function(e){
        heard = '';
        for(var i=0;i<e.results.length;i++){ heard += e.results[i][0].transcript; }
        $('aiInput').value = heard;
      };
      recog.onend = function(){
        recognizing = false; $('aiMic').classList.remove('recording');
        if(heard.trim()){ runAi(heard); }
        else if($('aiStatus').textContent==='在听…'){ aiStatus(''); }
      };
      recog.onerror = function(e){
        recognizing = false; $('aiMic').classList.remove('recording');
        var msg = {'not-allowed':'没有麦克风权限，可以在地址栏允许后再试，或直接打字。',
                   'no-speech':'没听到声音，再点一下麦克风试试。',
                   'network':'语音识别服务连不上，先直接打字吧。'}[e.error] || '语音识别出错了，先直接打字吧。';
        aiStatus(msg, true);
      };
    }catch(err){ recog = null; }
  }
  if(!recog){ $('aiMic').hidden = true; }
  $('aiMic').addEventListener('click', function(){
    if(!recog) return;
    if(recognizing){ recog.stop(); return; }
    heard = ''; $('aiInput').value = '';
    try{ recog.start(); recognizing = true; $('aiMic').classList.add('recording'); aiStatus('在听…'); }catch(err){}
  });

  // ---------- boot ----------
  render();
  scheduleSnapshot();
  setInterval(function(){
    if(state.view==='day' && dateKey(state.selectedDate)===todayKey()){
      renderTimeline(getDayActivities(todayKey()), true);
    }
  }, 30000);

  // scroll to now on first load
  requestAnimationFrame(function(){
    if(lastNowY==null) return;
    var wrap = document.querySelector('.timeline-wrap');
    wrap.scrollTop = Math.max(0, lastNowY - 160);
  });
})();
</script>

</body></html>
