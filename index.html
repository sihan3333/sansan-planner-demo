<p class="lead">三三作息簿是一款帮你记录、优化、安排每一天的日程 App，适合有固定作息、同时在推进长期学习目标的学生和刚工作的人。</p>
<div class="intro">
  <div><b>记录</b>到点提醒开始，一键打勾记下实际做了什么；晚上一次核对补齐没记录的。</div>
  <div><b>安排</b>一句话改日程、排明天；想到的事丢进收件箱，自动找空档；被打断了一键顺延。</div>
  <div><b>优化</b>每周小结、高效时段、学习进度预警，按你的真实记录给出调整建议。</div>
</div>
<section class="stage">
  <div class="guide" id="guide"></div>
  <div class="phone-wrap">
    <div class="viewbar" id="viewbar"></div>
    <div class="phone"><div class="screen" id="screen"></div><div class="toast" id="toast" hidden></div></div>
  </div>
</section>
<p class="foot">这是一个演示：数据都是虚构示例，时间由按钮推进，刷新页面会回到示例数据。为了改进 AI，演示会匿名记录你的操作和对 AI 说的话，不含身份信息，可以在「我的 → 提醒与隐私」里关掉。<a href="https://sansan-data.sihanzheng68.workers.dev/dashboard" target="_blank" rel="noopener">数据看板</a></p>
