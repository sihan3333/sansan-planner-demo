<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="三三作息簿公开演示：时间轴日程、基础模板与学习项目进度，内置数据均为虚构示例。">
<title>三三作息簿</title>
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF6E8;
  --surface:#FFFEF9;
  --surface-2:#EDF0DD;
  --ink:#2E3A26;
  --ink-soft:#6C7660;
  --ink-faint:#9CA48D;
  --line:#E4DDBE;
  --accent:#6B9136;
  --accent-2:#457635;
  --accent-ink:#FBFAEF;
  --danger:#B2503F;
  --danger-soft:#F3E1DC;
  --warn:#B7972E;
  --shadow:0 1px 2px rgba(46,58,38,.06),0 10px 28px -6px rgba(46,58,38,.14);
  --shadow-sm:0 1px 2px rgba(46,58,38,.08);

  --cat-sleep:#5F7F9B;
  --cat-wake:#B98F2E;
  --cat-life:#BD6873;
  --cat-exercise:#6C8F3D;
  --cat-learn:#38538C;
  --cat-learn-1:#24396B;
  --cat-learn-2:#38538C;
  --cat-learn-3:#4A67A8;
  --cat-learn-4:#2F5C99;
  --cat-learn-5:#5470A8;
  --cat-work:#345F26;
  --cat-commute:#C17A3A;
  --cat-care:#7D5D99;

  --gutter-w:44px;
  --point-lane-w:96px;
  --font-display:'Fraunces',Georgia,'Songti SC',serif;
  --font-body:'IBM Plex Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1F17; --surface:#22281D; --surface-2:#2A3123;
    --ink:#ECE8D6; --ink-soft:#AEB39B; --ink-faint:#747B65; --line:#3A4232;
    --accent:#9BC96B; --accent-2:#B7DE8C; --accent-ink:#152009;
    --danger:#E0968A; --danger-soft:#3A2621; --warn:#E0C169;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -6px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --cat-sleep:#A9C0D6; --cat-wake:#E4BE72; --cat-life:#E3AEB6; --cat-exercise:#A8CE7E;
    --cat-learn:#8CA9E0; --cat-work:#6FA657; --cat-commute:#E0A868; --cat-care:#B79FD9;
    --cat-learn-1:#7A93C4; --cat-learn-2:#8CA9E0; --cat-learn-3:#9DB6E8; --cat-learn-4:#7FA8D9; --cat-learn-5:#A5B8DE;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1F17; --surface:#22281D; --surface-2:#2A3123;
  --ink:#ECE8D6; --ink-soft:#AEB39B; --ink-faint:#747B65; --line:#3A4232;
  --accent:#9BC96B; --accent-2:#B7DE8C; --accent-ink:#152009;
  --danger:#E0968A; --danger-soft:#3A2621; --warn:#E0C169;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -6px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --cat-sleep:#A9C0D6; --cat-wake:#E4BE72; --cat-life:#E3AEB6; --cat-exercise:#A8CE7E;
  --cat-learn:#8CA9E0; --cat-work:#6FA657; --cat-commute:#E0A868; --cat-care:#B79FD9;
  --cat-learn-1:#7A93C4; --cat-learn-2:#8CA9E0; --cat-learn-3:#9DB6E8; --cat-learn-4:#7FA8D9; --cat-learn-5:#A5B8DE;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.app{max-width:760px;margin:0 auto;padding:20px 16px 96px;min-height:100vh;}

.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:19px;margin-right:auto;letter-spacing:.01em;}
.brand-icon{font-size:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(160deg, var(--surface-2), var(--surface));box-shadow:inset 0 0 0 1px var(--line);}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:11px;}
.tab{border:none;background:transparent;color:var(--ink-soft);font-family:var(--font-body);font-weight:500;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:color .15s ease;}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
.ghost-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:var(--font-body);font-size:13px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:color .15s ease,border-color .15s ease,transform .15s ease;}
.ghost-btn:hover{color:var(--ink);border-color:var(--ink-faint);transform:translateY(-1px);}
.ghost-btn.subtle{border-color:transparent;background:transparent;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
.ghost-btn.subtle:hover{transform:none;}
.primary-btn{border:none;background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 100%, white 10%), var(--accent));color:var(--accent-ink);font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 17px;border-radius:9px;cursor:pointer;box-shadow:var(--shadow-sm);transition:filter .15s ease,transform .15s ease;}
.primary-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.danger-btn{border:1px solid var(--danger);background:transparent;color:var(--danger);font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;cursor:pointer;transition:background .15s ease;}
.danger-btn:hover{background:var(--danger-soft);}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.daybar{display:flex;align-items:center;gap:10px;padding:16px 0 12px;flex-wrap:wrap;}
.daybar .navbtn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;font-size:16px;color:var(--ink-soft);cursor:pointer;}
.daybar .navbtn:hover{color:var(--ink);}
.date-jump{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;height:32px;font-size:12px;font-family:var(--font-mono);cursor:pointer;padding:0 6px;width:124px;color-scheme:light;}
.date-jump:hover{border-color:var(--ink-faint);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .date-jump{color-scheme:dark;}}
:root[data-theme="dark"] .date-jump{color-scheme:dark;}
.date-display{margin-right:auto;}
.date-num{font-family:var(--font-display);font-style:italic;font-size:27px;font-weight:600;line-height:1.1;text-wrap:balance;color:var(--accent-2);}
.date-week{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em;}
.date-week.is-today{color:var(--accent);font-weight:500;}

.learn-summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:2px;box-shadow:var(--shadow-sm);}
.ls-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--cat-learn);margin-bottom:9px;}
.ls-head #lsCount{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;}
.ls-bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-bottom:10px;}
.ls-bar-fill{height:100%;width:0;border-radius:2px;background:var(--cat-learn);transition:width .3s ease;}
.ls-list{display:flex;flex-wrap:wrap;gap:6px 16px;}
.ls-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink);cursor:pointer;}
.ls-item:hover{color:var(--cat-learn);}
.ls-item .ls-icon{font-size:11px;color:var(--cat-learn);width:11px;text-align:center;}
.ls-item.done{color:var(--ink-faint);text-decoration:line-through;}
.ls-item.done .ls-icon{color:var(--ink-faint);}
.ls-empty{font-size:12.5px;color:var(--ink-faint);}

.projects-view{margin-top:14px;}
.proj-list{display:flex;flex-direction:column;gap:16px;}
.proj-group{background:color-mix(in srgb, var(--cat-learn) 10%, var(--surface-2));border:1px solid color-mix(in srgb, var(--cat-learn) 30%, var(--line));border-radius:16px;padding:14px;}
.proj-group.uncategorized{background:var(--surface-2);border-color:var(--line);}
.proj-group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--cat-learn);margin:0 4px 10px;}
.proj-group.uncategorized .proj-group-head{color:var(--ink-soft);}
.proj-group.pinned{box-shadow:0 0 0 2px var(--cat-learn),var(--shadow-sm);}
.pgh-pin{border:none;background:transparent;color:var(--ink-faint);font-family:var(--font-body);font-weight:500;font-size:11.5px;cursor:pointer;padding:3px 7px;border-radius:20px;white-space:nowrap;}
.pgh-pin:hover{background:color-mix(in srgb, var(--cat-learn) 14%, transparent);color:var(--cat-learn);}
.pgh-pin.active{color:var(--cat-learn);background:color-mix(in srgb, var(--cat-learn) 16%, transparent);}
.proj-group-cards{display:flex;flex-direction:column;gap:10px;}
.proj-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm);}
.proj-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.proj-name{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink);}
.proj-head .proj-edit-btn{margin-left:auto;}
.proj-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:9px;}
.proj-bar-fill{height:100%;border-radius:3px;background:var(--cat-learn);transition:width .3s ease;}
.proj-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.proj-meta .proj-count{font-family:var(--font-mono);color:var(--ink);font-weight:500;}
.proj-meta .proj-countdown{color:var(--cat-learn);font-weight:600;}
.proj-meta .proj-countdown.done{color:var(--accent);}
.proj-update{display:flex;align-items:center;gap:8px;}
.proj-meta .proj-from-schedule{color:var(--ink-faint);font-size:11.5px;}
.link-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
.link-row select{flex:1;min-width:150px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 6px;font-family:var(--font-body);font-size:13.5px;}
.modal .link-row input[type=number]{width:72px;padding:7px 8px;font-family:var(--font-mono);font-size:13px;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:20px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;}
.proj-update input[type=number]{width:84px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 9px;font-family:var(--font-mono);font-size:13px;}
.proj-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 0;}

.celebrate-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(8,8,14,0);transition:background .6s ease;}
.celebrate-overlay.dark{background:rgba(8,8,14,.93);}
#fireworksCanvas{position:absolute;inset:0;width:100%;height:100%;}
.celebrate-message{position:relative;z-index:2;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:26px;color:#fff;text-align:center;padding:0 28px;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease;text-shadow:0 2px 24px rgba(255,255,255,.35);}
.celebrate-message.show{opacity:1;transform:translateY(0);}
.proj-quick-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.proj-quick-picks .pqp-chip{border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);border-radius:20px;padding:4px 11px;font-size:11.5px;cursor:pointer;}
.proj-quick-picks .pqp-chip:hover{border-color:var(--cat-learn);color:var(--cat-learn);}
.proj-quick-picks .pqp-hint{font-size:11px;color:var(--ink-faint);align-self:center;}
.proj-untracked{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:12px 4px 4px;font-size:12px;color:var(--ink-faint);}

.template-banner{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;margin:14px 0 2px;font-size:12px;color:var(--ink-soft);}
.template-banner .tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.template-banner .tb-stats{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.template-banner .tb-topics{margin-top:5px;font-size:11.5px;color:var(--cat-learn);}
.template-banner .tb-topics b{font-weight:600;color:var(--ink-soft);}

.timeline-wrap{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto;max-height:70vh;position:relative;}
.timeline{position:relative;margin:8px 12px 8px 0;}
.tl-section{position:absolute;left:0;right:0;}
.sleep-bar{position:absolute;left:12px;right:10px;background:var(--surface-2);border-radius:11px;padding:7px 10px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(46,58,38,.04);}
.sleep-range{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:2px;}
.sleep-item{display:flex;gap:7px;align-items:baseline;padding:2px 4px;cursor:pointer;border-radius:6px;}
.sleep-item:hover{background:rgba(0,0,0,.05);}
.sleep-item .sleep-item-dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--cat-color);align-self:center;}
.sleep-item .sleep-item-time{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap;}
.sleep-item .sleep-item-name{font-size:12px;color:var(--ink-soft);}
.sleep-item[data-cat="learn"] .sleep-item-name{font-weight:600;color:var(--ink);}
.sleep-item[data-cat="learn"] .sleep-item-name::before{content:'★ ';color:var(--cat-color);}
.hour-row{position:absolute;left:0;right:0;border-top:1px solid var(--line);}
.hour-row.half-row{border-top:1px dashed var(--line);}
.hour-row .hour-label{position:absolute;left:8px;top:-8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);background:var(--surface);padding:0 3px;}
.hour-row .hour-label.half-label{font-size:9.5px;}
.point-lane{position:absolute;left:var(--gutter-w);width:var(--point-lane-w);top:0;bottom:0;z-index:3;}
.point-item{position:absolute;left:0;right:4px;display:flex;align-items:center;gap:5px;height:18px;line-height:18px;transform:translateY(-50%);cursor:pointer;}
.point-item .point-dot{width:8px;height:8px;min-width:8px;border-radius:50%;background:var(--cat-color);box-shadow:0 0 0 2px var(--surface),0 0 0 1px color-mix(in srgb, var(--cat-color) 45%, transparent);cursor:pointer;position:relative;}
.point-item .point-dot.checked::after{content:'✓';position:absolute;inset:-2px;display:flex;align-items:center;justify-content:center;font-size:6px;line-height:1;color:var(--surface);}
.point-item .point-label{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.point-item:hover .point-label{color:var(--ink);}
.point-item.done{opacity:.6;}
.point-item.done .point-label{text-decoration:line-through;}
.point-item[data-cat="learn"] .point-label{font-weight:600;}
.point-item[data-cat="learn"] .point-label::before{content:'★ ';color:var(--cat-color);}
.activity-col{position:absolute;left:calc(var(--gutter-w) + var(--point-lane-w));right:10px;top:0;bottom:0;}
.activity-col .free-label{position:absolute;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:11px;font-style:italic;letter-spacing:.08em;color:var(--ink-faint);pointer-events:none;}
.activity{position:absolute;border-radius:7px;padding:4px 8px 4px 12px;cursor:pointer;overflow:hidden;background:color-mix(in srgb, var(--cat-color) 20%, var(--surface));box-shadow:0 1px 2px rgba(46,58,38,.06);transition:box-shadow .15s ease,transform .15s ease;}
.activity::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px;background:var(--cat-color);}
.activity:hover{box-shadow:0 3px 10px -2px rgba(46,58,38,.18);transform:translateY(-1px);z-index:2;}
.activity[data-cat="learn"]{
  background:color-mix(in srgb, var(--cat-color) 28%, var(--surface));
  box-shadow:0 2px 7px -1px color-mix(in srgb, var(--cat-color) 45%, transparent),
             inset 0 0 0 1.5px color-mix(in srgb, var(--cat-color) 55%, transparent);
}
.activity[data-cat="learn"]::before{width:6px;border-radius:6px;}
.activity[data-cat="learn"] .a-name{font-weight:600;}
.activity[data-cat="learn"] .a-name::before{content:'★ ';color:var(--cat-color);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .activity[data-cat="learn"]{background:color-mix(in srgb, var(--cat-color) 36%, var(--surface));}}
:root[data-theme="dark"] .activity[data-cat="learn"]{background:color-mix(in srgb, var(--cat-color) 36%, var(--surface));}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .activity{background:color-mix(in srgb, var(--cat-color) 30%, var(--surface));}}
:root[data-theme="dark"] .activity{background:color-mix(in srgb, var(--cat-color) 30%, var(--surface));}
.activity .a-head{display:flex;align-items:center;gap:5px;min-width:0;}
.activity .done-toggle{width:14px;height:14px;min-width:14px;border-radius:50%;border:1.5px solid var(--cat-color);cursor:pointer;position:relative;}
.activity .done-toggle:hover{background:color-mix(in srgb, var(--cat-color) 25%, transparent);}
.activity .done-toggle.checked{background:var(--cat-color);}
.activity .done-toggle.checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;color:var(--surface);}
.activity.done{opacity:.5;}
.activity.done .a-name{text-decoration:line-through;font-weight:400 !important;}
.activity.done .a-name::before{opacity:.6;}
.activity .a-name{flex:1;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;min-width:0;}
.activity .subs-badge{flex:none;font-size:10px;font-weight:400;color:var(--ink-soft);white-space:nowrap;}
.activity .a-head .group-tag{margin-left:auto;flex:none;font-size:9.5px;font-weight:500;color:var(--ink);background:color-mix(in srgb, var(--surface) 90%, transparent);border-radius:5px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(46,58,38,.15);}
.activity[data-cat="learn"] .a-head .group-tag{font-weight:600;}
.activity[data-cat="learn"] .a-head .group-tag::before{content:'★ ';color:var(--cat-color);}
.activity .subs-inline{position:absolute;top:0;left:0;right:0;bottom:0;}
.activity .subs-inline .sub-row-mini{position:absolute;left:5px;right:5px;display:flex;align-items:center;gap:6px;padding:0 7px;overflow:hidden;border-radius:5px;cursor:pointer;background:color-mix(in srgb, var(--cat-color) 13%, var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--cat-color) 35%, var(--line));}
.activity.has-subs .a-head{position:absolute;top:2px;right:3px;left:auto;max-width:calc(100% - 10px);z-index:2;background:color-mix(in srgb, var(--surface) 90%, transparent);border-radius:5px;padding:1px 5px;box-shadow:0 1px 3px rgba(46,58,38,.15);}
.activity .subs-inline .sub-row-mini .sub-time{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap;}
.activity .subs-inline .sub-row-mini .sub-name{font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.activity .subs-inline .sub-row-mini.done{opacity:.55;}
.activity .subs-inline .sub-row-mini.done .sub-name{text-decoration:line-through;}
.activity .subs-inline .sub-mini-toggle{width:11px;height:11px;min-width:11px;border-radius:50%;border:1.5px solid var(--cat-color);position:relative;}
.activity .subs-inline .sub-mini-toggle.checked{background:var(--cat-color);}
.activity .subs-inline .sub-mini-toggle.checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;line-height:1;color:var(--surface);}

  function flushEvents(){

    try{
      fetch(EVENTS_ENDPOINT, {method:'POST', headers:{'Content-Type':'text/plain'},

  // ---------- overlap layout ----------
  function layout(list){
    var items = list.map(function(a){ return {a:a, s:toMin(a.start), e:toMin(a.end)}; });
    items.sort(function(x,y){ return x.s-y.s || x.e-y.e; });
    var overlapIds = {};
    for(var i=0;i<items.length;i++){
      for(var j=i+1;j<items.length;j++){
        if(items[j].s < items[i].e && items[i].s < items[j].e){
          overlapIds[items[i].a.id]=true; overlapIds[items[j].a.id]=true;
        }
      }
    }
    // cluster + column assignment
    var clusters = [];
    var cur = [];
    var curEnd = -1;
    items.forEach(function(it){
      if(cur.length===0 || it.s < curEnd){
        cur.push(it); curEnd = Math.max(curEnd, it.e);
      } else {
        clusters.push(cur); cur=[it]; curEnd=it.e;
      }
    });
    if(cur.length) clusters.push(cur);

    var placements = [];
    clusters.forEach(function(cluster){
      var cols = []; // end time of last item in each column
      var colOf = [];
      cluster.forEach(function(it){
        var placed=false;
        for(var c=0;c<cols.length;c++){
          if(cols[c] <= it.s){ cols[c]=it.e; colOf.push(c); placed=true; break; }
        }
        if(!placed){ cols.push(it.e); colOf.push(cols.length-1); }
      });
      var maxCols = cols.length;
      cluster.forEach(function(it,idx){
        placements.push({a:it.a, s:it.s, e:it.e, col:colOf[idx], cols:maxCols, overlap: !!overlapIds[it.a.id]});
      });
    });
    return placements;
  }

  function renderLearnSummary(list){
    var learnActs = list.filter(function(a){ return a.cat==='learn'; })
      .sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    var wrap = $('lsList');
    wrap.innerHTML = '';
    if(!learnActs.length){
      wrap.innerHTML = '<span class="ls-empty">今天还没有学习安排</span>';
      $('lsCount').textContent = '';
      $('lsBarFill').style.width = '0%';
      return;
    }
    // count each activity in "units": one per sub-item if it has subs,
    // otherwise the activity itself is one unit — so a partly-done group
    // (say, 学编程 with 1 of 2 subs ticked) can show "1/2" instead of just a dot.
    // the card's own checkbox, if ticked, gives it full credit regardless of subs.
    function unitsOf(a){
      if(a.subs && a.subs.length){
        if(a.done) return {done:a.subs.length, total:a.subs.length};
        return {done:a.subs.filter(function(s){return s.done;}).length, total:a.subs.length};
      }
      return {done:a.done?1:0, total:1};
    }
    // activities that share the same "所属大类" label (falls back to the
    // activity's own name when no group is set) count as one summary line
    var groups = [], byKey = {};
    learnActs.forEach(function(a){
      var key = a.group || a.name;
      if(!byKey[key]){ byKey[key] = {label:key, items:[]}; groups.push(byKey[key]); }
      byKey[key].items.push(a);
    });
    var doneCount = 0;
    groups.forEach(function(g){
      var doneU=0, totalU=0;
      g.items.forEach(function(a){ var u=unitsOf(a); doneU+=u.done; totalU+=u.total; });
      var allDone = totalU>0 && doneU===totalU;
      var icon = allDone ? '✓' : (doneU>0 ? '◐' : '○');
      if(allDone) doneCount++;
      var item = document.createElement('span');
      item.className = 'ls-item' + (allDone?' done':'');
      item.innerHTML = '<span class="ls-icon"></span><span></span>';
      item.querySelector('.ls-icon').textContent = icon;
      var label = g.label + (!allDone && totalU>1 ? ' ('+doneU+'/'+totalU+')' : '');
      item.querySelector('span:last-child').textContent = label;
      item.addEventListener('click', function(){ openEdit(g.items[0].id); });
      wrap.appendChild(item);
    });
    $('lsCount').textContent = doneCount+'/'+groups.length+' 完成';
    $('lsBarFill').style.width = (groups.length ? doneCount/groups.length*100 : 0)+'%';
    maybeCelebrate(dateKey(state.selectedDate), doneCount, groups.length);
  }

  var fwCtx=null, fwAnimId=null, fwParticles=[], fwLaunchTimer=null;
  function startFireworks(){
    var canvas = $('fireworksCanvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fwCtx = canvas.getContext('2d');
    fwParticles = [];
    function launchOne(){
      var x = 30 + Math.random()*(canvas.width-60);
      var targetY = canvas.height*0.08 + Math.random()*canvas.height*0.55;
      var hue = Math.floor(Math.random()*360);
      var big = Math.random()<0.35;
      fwParticles.push({type:'rocket', x:x, y:canvas.height, vy:-(9+Math.random()*4), targetY:targetY, hue:hue, big:big});
    }
    function explode(x,y,hue,big){
      var count = (big ? 130 : 75) + Math.floor(Math.random()*35);
      var spreadMax = big ? 9 : 6;
      for(var i=0;i<count;i++){
        var angle = Math.random()*Math.PI*2;
        var speed = 0.8+Math.random()*spreadMax;
        fwParticles.push({type:'spark', x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:1, decay:0.010+Math.random()*0.010, size:big?2.6:2, hue: hue + (Math.random()*46-23)});
      }
    }
    function tick(){
      fwCtx.clearRect(0,0,canvas.width,canvas.height);
      fwCtx.globalCompositeOperation = 'lighter';
      fwParticles = fwParticles.filter(function(p){
        if(p.type==='rocket'){
          p.y += p.vy;
          fwCtx.beginPath();
          fwCtx.fillStyle = 'hsl('+p.hue+',95%,70%)';
          fwCtx.shadowColor = 'hsl('+p.hue+',95%,65%)';
          fwCtx.shadowBlur = 12;
          fwCtx.arc(p.x,p.y,p.big?3.5:2.5,0,Math.PI*2);
          fwCtx.fill();
          if(p.y<=p.targetY){ explode(p.x,p.y,p.hue,p.big); return false; }
          return true;
        }
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.045; p.vx*=0.985; p.life-=p.decay;
        if(p.life<=0) return false;
        fwCtx.beginPath();
        fwCtx.fillStyle='hsla('+p.hue+',95%,68%,'+p.life+')';
        fwCtx.shadowColor = 'hsla('+p.hue+',95%,68%,'+p.life+')';
        fwCtx.shadowBlur = 8;
        fwCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
        fwCtx.fill();
        return true;
      });
      fwCtx.shadowBlur = 0;
      fwCtx.globalCompositeOperation = 'source-over';
      fwAnimId = requestAnimationFrame(tick);
    }
    tick();
    launchOne(); launchOne();
    setTimeout(launchOne, 120);
    fwLaunchTimer = setInterval(function(){
      launchOne();
      if(Math.random()<0.5) setTimeout(launchOne, 130);
    }, 260);
  }
  function stopFireworks(){
    if(fwLaunchTimer){ clearInterval(fwLaunchTimer); fwLaunchTimer=null; }
    if(fwAnimId){ cancelAnimationFrame(fwAnimId); fwAnimId=null; }
    var canvas = $('fireworksCanvas');
    if(fwCtx) fwCtx.clearRect(0,0,canvas.width,canvas.height);
    fwParticles=[];
  }

  var lastNowY = null;

  function mergeSleepIntervals(sleepActs){
    var sorted = sleepActs.slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
    var merged = [];
    sorted.forEach(function(a){
      var s=toMin(a.start), e=toMin(a.end);
      if(merged.length && s <= merged[merged.length-1].end){
        merged[merged.length-1].end = Math.max(merged[merged.length-1].end, e);
        merged[merged.length-1].acts.push(a);
      } else {
        merged.push({start:s, end:e, acts:[a]});
      }
    });
    return merged;
  }
  function buildSections(list){
    var pointActs = list.filter(function(a){ return a.kind==='point'; });
    var isSleepy = function(a){ return a.cat==='sleep' || a.cat==='wake'; };
    var sleepActs = list.filter(function(a){ return a.kind!=='point' && isSleepy(a); });
    var rangeActs = list.filter(function(a){ return a.kind!=='point' && !isSleepy(a); });
    var merged = mergeSleepIntervals(sleepActs);
    var sections = [];
    var cursor = 0;
    merged.forEach(function(iv){
      if(iv.start > cursor) sections.push({type:'normal', start:cursor, end:iv.start});
      sections.push({type:'sleep', start:iv.start, end:iv.end, acts:iv.acts});
      cursor = iv.end;
    });
    if(cursor < 1440) sections.push({type:'normal', start:cursor, end:1440});
    sections.forEach(function(sec){
      var inRange = function(a){ var s=toMin(a.start); return s>=sec.start && s<sec.end; };
      if(sec.type==='normal'){
        sec.rangeActs = rangeActs.filter(inRange);
        sec.pointActs = pointActs.filter(inRange);
      } else {
        sec.pointsInline = pointActs.filter(inRange);
      }
    });
    return sections;
  }

  function renderTimeline(list, isToday){
    var tl = $('timeline');
    tl.innerHTML = '';
    var sections = buildSections(list);
    var y = 0;
    var now = new Date();
    var nowMin = isToday ? (now.getHours()*60+now.getMinutes()) : null;
    var nowY = null;

    sections.forEach(function(sec){
      if(sec.type==='normal'){
        var secH = (sec.end-sec.start)/60*HOUR_PX;
        var secEl = document.createElement('div');
        secEl.className = 'tl-section normal-section';
        secEl.style.top = y+'px';
        secEl.style.height = secH+'px';

        var stepStart = Math.ceil(sec.start/30)*30;
        for(var m=stepStart; m<=sec.end; m+=30){
          var isHour = (m%60===0);
          var hy = (m-sec.start)/60*HOUR_PX;
          var row = document.createElement('div');
          row.className = 'hour-row' + (isHour?'':' half-row');
          row.style.top = hy+'px';
          if(m < sec.end){
            var lbl = document.createElement('span');
            lbl.className = 'hour-label' + (isHour?'':' half-label');
            lbl.textContent = pad2(Math.floor(m/60))+':'+pad2(m%60);
            row.appendChild(lbl);
          }
          secEl.appendChild(row);
        }
        var col = document.createElement('div');
        col.className = 'activity-col';
        secEl.appendChild(col);

        // mark stretches of an hour or more with no activity as "空闲",
        // so blank space reads as "on purpose", not "forgot to fill this in"
        (function(){
          var FREE_MIN = 60;
          var occ = sec.rangeActs.map(function(a){ return {s:toMin(a.start)-sec.start, e:toMin(a.end)-sec.start}; })
            .sort(function(x,y){ return x.s-y.s; });
          var merged = [];
          occ.forEach(function(iv){
            var last = merged[merged.length-1];
            if(last && iv.s<=last.e){ last.e = Math.max(last.e, iv.e); }
            else merged.push({s:iv.s, e:iv.e});
          });
          var cursor = 0, gaps = [];
          merged.forEach(function(iv){
            if(iv.s-cursor>=FREE_MIN) gaps.push({s:cursor, e:iv.s});
            cursor = Math.max(cursor, iv.e);
          });
          if((sec.end-sec.start)-cursor>=FREE_MIN) gaps.push({s:cursor, e:sec.end-sec.start});
          gaps.forEach(function(g){
            var label = document.createElement('div');
            label.className = 'free-label';
            label.style.top = ((g.s+g.e)/2/60*HOUR_PX)+'px';
            label.textContent = '空闲';
            col.appendChild(label);
          });
        })();

        var CARD_GAP = 5, CARD_MIN = 15;
        var placements = layout(sec.rangeActs);
        placements.forEach(function(p){
          var relS = p.s - sec.start, relE = p.e - sec.start;
          var trueTop = relS/60*HOUR_PX;
          var trueH = Math.max((relE-relS)/60*HOUR_PX, 1);
          var visH = Math.min(Math.max(trueH-CARD_GAP, CARD_MIN), trueH);
          var visTop = trueTop + (trueH-visH)/2;
          var el = document.createElement('div');
          var ci = catInfo(p.a.cat);
          var sizeClass = visH<16 ? ' tiny' : (visH<32 ? ' short' : '');
          el.className = 'activity' + (p.overlap?' overlap':'') + sizeClass + (p.a.done?' done':'') + (aiFlashIds[p.a.id]?' ai-changed':'');
          el.dataset.cat = p.a.cat;
          el.style.setProperty('--cat-color','var('+catColorVar(p.a)+')');
          var widthPct = 100/p.cols;
          el.style.top = visTop+'px';
          el.style.height = visH+'px';
          el.style.width = 'calc('+widthPct+'% - 4px)';
          el.style.left = (p.col*widthPct)+'%';
          el.innerHTML = '<div class="a-head"><span class="done-toggle" title="标记完成"></span><div class="a-name"></div></div><div class="a-time"></div>' + (p.overlap? '<span class="a-warn" title="时间与其他活动重叠">⚠</span>':'');
          if(p.a.done){ el.querySelector('.done-toggle').classList.add('checked'); }
          el.querySelector('.a-name').textContent = p.a.name;
          if(p.a.group){
            var groupTag = document.createElement('span');
            groupTag.className = 'group-tag';
            groupTag.textContent = p.a.group;
            el.querySelector('.a-head').appendChild(groupTag);
          }
          if(p.a.subs && p.a.subs.length){
            var badge = document.createElement('span');
            badge.className = 'subs-badge';
            badge.textContent = p.a.subs.length+'项细分';
            el.querySelector('.a-head').appendChild(badge);
            // lay the sub-breakdown out on the SAME true time scale as the
            // rest of the timeline, so each box lines up with the hour grid
            // behind it (and with the now-line) instead of being squeezed to
            // fit under the title. the title floats as a small tag instead
            // of reserving its own row, so it never eats into that scale.
            el.classList.add('has-subs');
            el.querySelector('.a-time').style.display = 'none';
            var pxPerMin = HOUR_PX/60;
            var parentStart = toMin(p.a.start);
            var SUB_GAP = 3, SUB_MIN = 11;
            var subsWrap = document.createElement('div');
            subsWrap.className = 'subs-inline';
            var sortedSubs = p.a.subs.slice().sort(function(x,y){ return toMin(x.start)-toMin(y.start); });
            sortedSubs.forEach(function(s){
              var sTrueTop = (toMin(s.start)-parentStart)*pxPerMin;
              var sTrueH = Math.max((toMin(s.end)-toMin(s.start))*pxPerMin, 1);
              var sVisH = Math.min(Math.max(sTrueH-SUB_GAP, SUB_MIN), sTrueH);
              var sVisTop = sTrueTop + (sTrueH-sVisH)/2;
              var sr = document.createElement('div');
              sr.className = 'sub-row-mini' + (s.done?' done':'');
              sr.style.top = sVisTop+'px';
              sr.style.height = sVisH+'px';
              sr.innerHTML = '<span class="sub-mini-toggle'+(s.done?' checked':'')+'"></span><span class="sub-time"></span><span class="sub-name"></span>';
              sr.querySelector('.sub-time').textContent = s.start+'–'+s.end;
              sr.querySelector('.sub-name').textContent = s.name;
              sr.addEventListener('click', function(e){
                e.stopPropagation();
                toggleSubDone(p.a.id, s.id);
              });
              subsWrap.appendChild(sr);
            });
            el.appendChild(subsWrap);
          }
          el.querySelector('.a-time').textContent = p.a.start+'–'+p.a.end;
          el.title = p.a.start+'–'+p.a.end+' '+p.a.name;
          el.addEventListener('click', function(){ openEdit(p.a.id); });
          el.querySelector('.done-toggle').addEventListener('click', function(e){
            e.stopPropagation();
            toggleDone(p.a.id);
          });
          col.appendChild(el);
        });

        // point markers, clustered so close-together times don't overlap
        var pointLane = document.createElement('div');
        pointLane.className = 'point-lane';
        secEl.appendChild(pointLane);
        var CLUSTER_PX = 18, ROW_H = 18;
        var pts = sec.pointActs.map(function(a){
          return { a:a, trueY: (toMin(a.start)-sec.start)/60*HOUR_PX };
        }).sort(function(x,y){ return x.trueY-y.trueY; });
        var pClusters = [];
        pts.forEach(function(pt){
          var last = pClusters[pClusters.length-1];
          if(last && pt.trueY - last.lastY < CLUSTER_PX){
            last.items.push(pt); last.lastY = pt.trueY;
          } else {
            pClusters.push({anchorY: pt.trueY, lastY: pt.trueY, items:[pt]});
          }
        });
        var PT_HALF = 9; // half of point-item row height, kept in sync with CSS
        pClusters.forEach(function(cl){
          cl.items.forEach(function(pt, idx){
            var row = document.createElement('div');
            row.className = 'point-item' + (pt.a.done?' done':'');
            var rowY = cl.anchorY + idx*ROW_H;
            rowY = Math.max(PT_HALF, Math.min(secH-PT_HALF, rowY));
            row.style.top = rowY+'px';
            row.dataset.cat = pt.a.cat;
            row.style.setProperty('--cat-color','var('+catColorVar(pt.a)+')');
            row.innerHTML = '<span class="point-dot'+(pt.a.done?' checked':'')+'"></span><span class="point-label"></span>';
            row.querySelector('.point-label').textContent = pt.a.start+' '+pt.a.name + (pt.a.group?' ('+pt.a.group+')':'');
            row.title = pt.a.start+' '+pt.a.name;
            row.addEventListener('click', function(){ openEdit(pt.a.id); });
            row.querySelector('.point-dot').addEventListener('click', function(e){
              e.stopPropagation();
              toggleDone(pt.a.id);
            });
            pointLane.appendChild(row);
          });
        });

        if(nowMin!==null && nowMin>=sec.start && nowMin<sec.end){
          nowY = y + (nowMin-sec.start)/60*HOUR_PX;
        }
        tl.appendChild(secEl);
        y += secH;
      } else {
        var sleepRows = sec.acts.map(function(a){ return {a:a, isPoint:false}; })
          .concat(sec.pointsInline.map(function(a){ return {a:a, isPoint:true}; }))
          .sort(function(x,y){ return toMin(x.a.start)-toMin(y.a.start); });
        var barH = 34 + sleepRows.length*20;
        var bar = document.createElement('div');
        bar.className = 'tl-section sleep-bar';
        bar.style.top = y+'px';
        bar.style.height = barH+'px';
        var rangeLabel = document.createElement('div');
        rangeLabel.className = 'sleep-range';
        rangeLabel.textContent = '🌙 '+toHHMM(sec.start)+'–'+toHHMM(sec.end);
        bar.appendChild(rangeLabel);
        sleepRows.forEach(function(r){
          var a = r.a;
          var row = document.createElement('div');
          row.className = 'sleep-item';
          row.dataset.cat = a.cat;
          row.style.setProperty('--cat-color','var('+catColorVar(a)+')');
          row.innerHTML = '<span class="sleep-item-dot"></span><span class="sleep-item-time"></span><span class="sleep-item-name"></span>';
          row.querySelector('.sleep-item-time').textContent = r.isPoint ? a.start : (a.start+'–'+a.end);
          row.querySelector('.sleep-item-name').textContent = a.name + (a.group?' ('+a.group+')':'');
          row.addEventListener('click', function(){ openEdit(a.id); });
          bar.appendChild(row);
        });
        if(nowMin!==null && nowMin>=sec.start && nowMin<sec.end){
          nowY = y + (nowMin-sec.start)/(sec.end-sec.start)*barH;
        }
        tl.appendChild(bar);
        y += barH;
      }
    });

    tl.style.height = y+'px';
    lastNowY = nowY;
    if(nowY!==null){
      var line = document.createElement('div');
      line.className='now-line';
      line.style.top = nowY+'px';
      line.innerHTML = '<div class="now-dot"></div><div class="now-label">'+pad2(now.getHours())+':'+pad2(now.getMinutes())+'</div>';
      tl.appendChild(line);
    }
  }

  // ---------- modal: add/edit ----------
  var tempSubs = [];
  var editingSubId = null;

  function fillHourMinSelects(hourSels, minSels){
    hourSels.forEach(function(sel){
      sel.innerHTML='';
      for(var h=0; h<=24; h++){
        var o=document.createElement('option'); o.value=h; o.textContent=pad2(h); sel.appendChild(o);
      }
    });
    minSels.forEach(function(sel){
      sel.innerHTML='';
      for(var m=0; m<60; m+=5){
        var o=document.createElement('option'); o.value=m; o.textContent=pad2(m); sel.appendChild(o);
      }
    });
  }
  function populateSelects(){
    fillHourMinSelects([$('fStartH'),$('fEndH')], [$('fStartM'),$('fEndM')]);
  }
  function updateKindUI(kind){
    document.querySelectorAll('#kindPicker .kind-opt').forEach(function(b){
      b.classList.toggle('selected', b.dataset.kind===kind);
    });
    $('endTimeGroup').hidden = (kind==='point');
    $('subsSection').hidden = (kind==='point');
    $('startLabel').textContent = kind==='point' ? '时间' : '开始';
  }
  document.querySelectorAll('#kindPicker .kind-opt').forEach(function(b){
    b.addEventListener('click', function(){ updateKindUI(b.dataset.kind); });
  });
  function selectedKind(){
    var b = document.querySelector('#kindPicker .kind-opt.selected');
    return b ? b.dataset.kind : 'range';
  }
  function renderSubsList(){
    var wrap = $('subsList');
    wrap.innerHTML='';
    tempSubs.slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); }).forEach(function(s){
      var row = document.createElement('div');
      row.className='sub-row'+(s.done?' done':'');
      row.innerHTML = '<span class="sub-done-toggle'+(s.done?' checked':'')+'"></span><span class="sub-time"></span><span class="sub-name"></span><button type="button" class="sub-del" title="删除">×</button>';
      row.querySelector('.sub-time').textContent = s.start+'–'+s.end;
      row.querySelector('.sub-name').textContent = s.name;
      row.addEventListener('click', function(e){
        if(e.target.classList.contains('sub-del') || e.target.classList.contains('sub-done-toggle')) return;
        openSubForm(s);
      });
      row.querySelector('.sub-del').addEventListener('click', function(e){
        e.stopPropagation();
        tempSubs = tempSubs.filter(function(x){ return x.id!==s.id; });
        renderSubsList();
      });
      row.querySelector('.sub-done-toggle').addEventListener('click', function(e){
        e.stopPropagation();
        tempSubs = tempSubs.map(function(x){ return x.id===s.id ? {id:x.id, name:x.name, start:x.start, end:x.end, done:!x.done} : x; });
        renderSubsList();
      });
      wrap.appendChild(row);
    });
  }
  function openSubForm(sub){
    fillHourMinSelects([$('subStartH'),$('subEndH')], [$('subStartM'),$('subEndM')]);
    if(sub){
      editingSubId = sub.id;
      $('subName').value = sub.name;
      setSelectPair($('subStartH'),$('subStartM'), toMin(sub.start));
      setSelectPair($('subEndH'),$('subEndM'), toMin(sub.end));
      $('subDeleteBtn').hidden = false;
    } else {
      editingSubId = null;
      $('subName').value = '';
      var base = currentEditBaseRange();
      var startDefault = base.start;
      if(tempSubs.length){ startDefault = Math.max.apply(null, tempSubs.map(function(s){return toMin(s.end);})); }
      setSelectPair($('subStartH'),$('subStartM'), Math.min(startDefault, base.end));
      setSelectPair($('subEndH'),$('subEndM'), Math.min(startDefault+30, base.end));
      $('subDeleteBtn').hidden = true;
    }
    $('addSubBtn').hidden = true;
    $('subForm').hidden = false;
    $('subName').focus();
  }
  function closeSubForm(){
    $('subForm').hidden = true;
    $('addSubBtn').hidden = false;
    editingSubId = null;
  }
  function currentEditBaseRange(){
    var t = readTimeSelects();
    return t;
  }
  function setSelectPair(hSel,mSel,min){
    hSel.value = Math.floor(min/60);
    mSel.value = min%60 - (min%60)%5;
  }
  $('addSubBtn').addEventListener('click', function(){ openSubForm(null); });
  $('subCancelBtn').addEventListener('click', closeSubForm);
  $('subSaveBtn').addEventListener('click', function(){
    var name = $('subName').value.trim();
    if(!name){ showWarning('细分也需要一个名字。'); return; }
    var sh=+$('subStartH').value, sm=+$('subStartM').value, eh=+$('subEndH').value, em=+$('subEndM').value;
    if(sh>=24) sm=0; if(eh>=24) em=0;
    var s0=sh*60+sm, e0=eh*60+em;
    if(e0<=s0){ showWarning('细分的结束时间要晚于开始时间。'); return; }
    // if this sub reaches outside the parent block's own time range, expand
    // the parent to cover it instead of leaving an inconsistent gap
    var parentRange = readTimeSelects();
    var newStart = Math.min(parentRange.start, s0);
    var newEnd = Math.max(parentRange.end, e0);
    if(newStart!==parentRange.start || newEnd!==parentRange.end){
      setTimeSelects(newStart, newEnd);
      showWarning('细分超出了原来的时间范围，已经把大块的时间同步扩展到 '+toHHMM(newStart)+'–'+toHHMM(newEnd)+'。');
    }
    if(editingSubId){
      tempSubs = tempSubs.map(function(x){ return x.id===editingSubId ? {id:x.id, name:name, start:toHHMM(s0), end:toHHMM(e0), done:x.done} : x; });
    } else {
      tempSubs.push({id:uid(), name:name, start:toHHMM(s0), end:toHHMM(e0), done:false});
    }
    closeSubForm();
    renderSubsList();
  });
  $('subDeleteBtn').addEventListener('click', function(){
    tempSubs = tempSubs.filter(function(x){ return x.id!==editingSubId; });
    closeSubForm();
    renderSubsList();
  });
  function renderCatPicker(selectedKey){
    var wrap = $('catPicker');
    wrap.innerHTML='';
    CATS.forEach(function(c){
      var el = document.createElement('div');
      el.className='cat-opt'+(c.key===selectedKey?' selected':'');
      el.dataset.cat=c.key;
      el.style.setProperty('--dot-color','var('+c.varName+')');
      el.innerHTML='<span class="dot"></span>'+c.label;
      el.addEventListener('click', function(){
        wrap.querySelectorAll('.cat-opt').forEach(function(o){o.classList.remove('selected');});
        el.classList.add('selected');
      });
      wrap.appendChild(el);
    });
  }
  function currentList(){
    if(state.editing.scope==='day') return getDayActivities(dateKey(state.selectedDate));
    return state.template;
  }
  function persistCurrentList(list){
    if(state.editing.scope==='day'){
      state.days[dateKey(state.selectedDate)] = list;
      saveDays(state.days);
    } else {
      state.template = list;
      saveTemplate(list);
    }
  }

  function toggleDone(id){
    var scope = state.view==='day' ? 'day' : 'template';
    var key = dateKey(state.selectedDate);
    var list = (scope==='day' ? getDayActivities(key) : state.template).map(function(a){
      return a.id===id ? {id:a.id, name:a.name, start:a.start, end:a.end, cat:a.cat, kind:a.kind||'range', group:a.group||'', projectId:a.projectId||'', amount:a.amount||0, subs:a.subs||[], done:!a.done} : a;
    });
    var before = isComplete(findById(scope==='day' ? getDayActivities(key) : state.template, id));
    if(scope==='day'){ state.days[key] = list; saveDays(state.days); }
    else { state.template = list; saveTemplate(list); }
    if(scope==='day'){
      var t = findById(list, id);
      announceProgress(t, before);
      if(t) track('activity_toggled', {date:key, name:t.name, cat:t.cat, start:t.start, end:t.end, done:!!t.done, at:toHHMM(nowMinutes())});
    }
    render();
  }
  function nowMinutes(){ var d = new Date(); return d.getHours()*60+d.getMinutes(); }

  // ---------- activity → learning project progress ----------
  // a day's activity linked to a project counts toward it once it's fully done:
  // its own checkbox, or every one of its sub-items ticked. progress is derived
  // from the day records rather than stored, so un-ticking takes it back out.
  function findById(list, id){ return list.filter(function(a){ return a.id===id; })[0]; }
  function isComplete(a){
    if(!a) return false;
    if(a.done) return true;
    return !!(a.subs && a.subs.length && a.subs.every(function(s){ return s.done; }));
  }
  function credited(projectId){
    var sum = 0;
    Object.keys(state.days).forEach(function(k){
      state.days[k].forEach(function(a){
        if(a.projectId===projectId && a.amount>0 && isComplete(a)) sum += a.amount;
      });
    });
    return Math.round(sum*100)/100;
  }
  function progressOf(p){ return Math.round((p.current + credited(p.id))*100)/100; }
  function projectById(id){ return state.projects.filter(function(p){ return p.id===id; })[0]; }
  var toastTimer = null;
  function showToast(msg, action){
    var t = $('toast');
    t.textContent = msg;
    if(action){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-action'; b.textContent = action.label;
      b.addEventListener('click', function(){ t.hidden = true; action.fn(); });
      t.appendChild(b);
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, action ? 7000 : 2800);
  }
  function announceProgress(a, wasComplete){
    if(!a || !a.projectId || !(a.amount>0)) return;
    var now = isComplete(a);
    if(now===wasComplete) return;
    var p = projectById(a.projectId);
    if(!p) return;
    var unit = p.unit||'个';
    showToast(p.name+' '+(now?'+':'−')+a.amount+' '+unit+' · 现在 '+progressOf(p)+'/'+p.total+' '+unit);
  }

  function toggleSubDone(activityId, subId){
    var scope = state.view==='day' ? 'day' : 'template';
    var key = dateKey(state.selectedDate);
    var before = isComplete(findById(scope==='day' ? getDayActivities(key) : state.template, activityId));
    var list = (scope==='day' ? getDayActivities(key) : state.template).map(function(a){
      if(a.id!==activityId) return a;
      var subs = (a.subs||[]).map(function(s){
        return s.id===subId ? {id:s.id, name:s.name, start:s.start, end:s.end, done:!s.done} : s;
      });
      return {id:a.id, name:a.name, start:a.start, end:a.end, cat:a.cat, kind:a.kind||'range', group:a.group||'', projectId:a.projectId||'', amount:a.amount||0, done:a.done, subs:subs};
    });
    if(scope==='day'){ state.days[key] = list; saveDays(state.days); }
    else { state.template = list; saveTemplate(list); }
    if(scope==='day') announceProgress(findById(list, activityId), before);
    render();
  }

  // ---------- learning projects ----------
  function buildProjectCard(p){
    var cur = progressOf(p), fromSchedule = credited(p.id);
    var pct = p.total>0 ? Math.min(100, cur/p.total*100) : 0;
    var remaining = Math.max(p.total-cur, 0);
    var card = document.createElement('div');
    card.className = 'proj-card';
    var countdownHtml;
    if(cur>=p.total){
      countdownHtml = '<span class="proj-countdown done">🎉 已完成</span>';
    } else if(p.dailyTarget>0){
      var days = Math.ceil(remaining/p.dailyTarget);
      countdownHtml = '<span class="proj-countdown">还剩 '+days+' 天</span>';
    } else {
      countdownHtml = '<span class="proj-countdown" style="color:var(--ink-faint)">未设定每日目标</span>';
    }
    card.innerHTML =
      '<div class="proj-head"><span class="proj-name"></span><button class="ghost-btn proj-edit-btn">编辑</button></div>'+
      '<div class="proj-bar"><div class="proj-bar-fill"></div></div>'+
      '<div class="proj-meta">'+
        '<span class="proj-count"></span>'+
        '<span class="proj-daily"></span>'+
        countdownHtml+
      '</div>'+
      '<div class="proj-update">'+
        '<input type="number" class="proj-current-input" min="0">'+
        '<button class="primary-btn proj-save-btn">更新进度</button>'+
      '</div>';
    card.querySelector('.proj-name').textContent = p.name;
    card.querySelector('.proj-bar-fill').style.width = pct+'%';
    card.querySelector('.proj-count').textContent = cur+'/'+p.total+' '+(p.unit||'个');
    card.querySelector('.proj-daily').textContent = p.dailyTarget>0 ? ('每天目标 '+p.dailyTarget+' '+(p.unit||'个')) : '';
    if(fromSchedule>0){
      var fs = document.createElement('span');
      fs.className = 'proj-from-schedule';
      fs.textContent = '其中 '+fromSchedule+' '+(p.unit||'个')+' 来自日程打勾';
      card.querySelector('.proj-meta').appendChild(fs);
    }
    card.querySelector('.proj-current-input').value = cur;
    card.querySelector('.proj-edit-btn').addEventListener('click', function(){ openProjectEdit(p.id); });
    card.querySelector('.proj-save-btn').addEventListener('click', function(){
      var input = card.querySelector('.proj-current-input');
      var v = parseFloat(input.value);
      if(isNaN(v) || v<0){ return; }
      updateProjectProgress(p.id, v);
    });
    return card;
  }
  function renderProjects(){
    var wrap = $('projList');
    wrap.innerHTML = '';
    if(!state.projects.length){
      wrap.innerHTML = '<div class="proj-empty">还没有学习项目，点右下角"＋"加一个，比如"Python教程 共30集"</div>';
      return;
    }
    // group projects by "所属大类" into one big box per category, ordered to
    // match how they already appear in the schedule; uncategorized last
    var byCat = {};
    state.projects.forEach(function(p){
      var key = p.category || '';
      if(!byCat[key]) byCat[key] = [];
      byCat[key].push(p);
    });
    var scheduleCats = getLearnCategoryNames();
    var usedCats = Object.keys(byCat).filter(function(k){ return k!==''; });
    var order = scheduleCats.filter(function(c){ return usedCats.indexOf(c)!==-1; })
      .concat(usedCats.filter(function(c){ return scheduleCats.indexOf(c)===-1; }));
    if(byCat['']) order.push('');
    // pinned categories jump to the front, in the order you pinned them —
    // this is your own call on what matters most right now, not the clock's
    var pinnedInOrder = state.pinnedCats.filter(function(c){ return order.indexOf(c)!==-1; });
    order = pinnedInOrder.concat(order.filter(function(c){ return pinnedInOrder.indexOf(c)===-1; }));

    order.forEach(function(catKey){
      var isPinned = state.pinnedCats.indexOf(catKey)!==-1;
      var group = document.createElement('div');
      group.className = 'proj-group' + (catKey===''?' uncategorized':'') + (isPinned?' pinned':'');
      var head = document.createElement('div');
      head.className = 'proj-group-head';
      head.innerHTML = '<span class="pgh-name"></span>';
      head.querySelector('.pgh-name').textContent = catKey || '未分类';
      if(catKey!==''){
        var pinBtn = document.createElement('button');
        pinBtn.className = 'pgh-pin'+(isPinned?' active':'');
        pinBtn.type = 'button';
        pinBtn.title = isPinned ? '取消置顶' : '置顶这个大类';
        pinBtn.textContent = isPinned ? '📌 已置顶' : '📌 置顶';
        pinBtn.addEventListener('click', function(){
          if(isPinned){ state.pinnedCats = state.pinnedCats.filter(function(c){ return c!==catKey; }); }
          else { state.pinnedCats = state.pinnedCats.concat([catKey]); }
          savePinnedCats(state.pinnedCats);
          renderProjects();
        });
        head.appendChild(pinBtn);
      }
      group.appendChild(head);
      var cardsWrap = document.createElement('div');
      cardsWrap.className = 'proj-group-cards';
      byCat[catKey].forEach(function(p){ cardsWrap.appendChild(buildProjectCard(p)); });
      group.appendChild(cardsWrap);
      wrap.appendChild(group);
    });

    // gently point out which of your learning "大类" have no progress
    // tracker yet, so this list can actually grow to cover all of them
    var trackedCats = state.projects.map(function(p){ return p.category; }).filter(Boolean);
    var untracked = scheduleCats.filter(function(n){ return trackedCats.indexOf(n)===-1; });
    if(untracked.length){
      var hint = document.createElement('div');
      hint.className = 'proj-untracked';
      hint.innerHTML = '<span>还没建进度追踪的大类：</span>';
      untracked.forEach(function(n){
        var chip = document.createElement('span');
        chip.className = 'pqp-chip';
        chip.textContent = '+ '+n;
        chip.addEventListener('click', function(){ openProjectAdd(); $('pjCategory').value = n; });
        hint.appendChild(chip);
      });
      wrap.appendChild(hint);
    }
  }

  // ---------- AI：一句话改日程 + 自动重排 ----------
  // 分工：大模型（或本地规则兜底）只负责把一句话翻译成「操作指令」；
  // 时间怎么顺延、放不下先压缩谁、最后移出谁，全部由下面的固定规则决定，
  // 并且先给用户预览，确认后才写入。
  //
  // 部署 worker/ 目录里的中转服务后，把地址填在这里，就会用 DeepSeek 理解；
  // 留空时在 Claude 里打开会用 Claude，否则用本地规则理解常见说法。
  var AI_ENDPOINT = 'https://sansan-ai.sihanzheng68.workers.dev';

  var sampleAPI = null;

  function round5(m){ return Math.round(m/5)*5; }
  function ceil5(m){ return Math.ceil(m/5)*5; }
  function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }

  // ----- 本地规则理解（没有大模型时的兜底，也覆盖演示用的常见说法） -----
  var CN_DIGIT = {'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  function cnNum(s){
    if(!s) return NaN;
    if(/^\d+$/.test(s)) return +s;
    var m = s.match(/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/);
    if(m) return (m[1]?CN_DIGIT[m[1]]:1)*10 + (m[2]?CN_DIGIT[m[2]]:0);
    if(s.length===1 && (s in CN_DIGIT)) return CN_DIGIT[s];
    return NaN;
  }
  var NUM = '(\\d{1,2}|[零〇一二两三四五六七八九十]{1,3})';
  var PERIODS = '凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|今晚|夜里';
  var TIME_RE = new RegExp('('+PERIODS+')?\\s*'+NUM+'\\s*(?:点|:|：)\\s*(半|一刻|三刻|'+NUM+'\\s*分?)?', 'g');
  var DUR_RE = new RegExp(NUM+'\\s*个?\\s*(半)?\\s*(?:小时|钟头)|(半)\\s*个?\\s*(?:小时|钟头)|'+NUM+'\\s*分钟');
  var PERIOD_WINDOW = {
    '凌晨':[0,360], '早上':[360,600], '早晨':[360,600], '上午':[480,720], '中午':[690,840],
    '下午':[720,1080], '傍晚':[1020,1170], '晚上':[1080,null], '今晚':[1080,null], '夜里':[1200,null]
  };
  function withPeriod(p, h){
    if(/下午|傍晚|晚上|今晚|夜里/.test(p||'')){ if(h<12) h+=12; }
    else if(p==='中午'){ if(h<=3) h+=12; }
    else if(!p){ if(h>=1 && h<=6) h+=12; } // "三点开会" almost always means the afternoon
    return h;
  }
  function parseTimes(text){
    var out = [], m;
    TIME_RE.lastIndex = 0;
    while((m = TIME_RE.exec(text))){
      var h = cnNum(m[2]);
      if(isNaN(h) || h>24) continue;
      var mm = 0;
      if(m[3]==='半') mm = 30; else if(m[3]==='一刻') mm = 15; else if(m[3]==='三刻') mm = 45;
      else if(m[4]) mm = cnNum(m[4]);
      if(isNaN(mm) || mm>59) mm = 0;
      out.push({period:m[1]||'', h:h, mm:mm, index:m.index, len:m[0].length});
    }
    // "三点到五点": the second time inherits the first one's period
    for(var i=0;i<out.length;i++){
      var t = out[i], prev = out[i-1];
      var linked = prev && /^\s*(到|至|-|~|～|—)\s*$/.test(text.slice(prev.index+prev.len, t.index));
      var p = t.period || (linked ? prev.period : '');
      var h2 = withPeriod(p, t.h);
      t.min = Math.min(h2*60 + t.mm, 1440);
      if(linked && t.min <= prev.min && t.min+720 <= 1440) t.min += 720;
      t.linked = !!linked;
    }
    return out;
  }
  function parseDuration(text){
    var m = text.match(DUR_RE);
    if(!m) return null;
    if(m[1]) return cnNum(m[1])*60 + (m[2]?30:0);
    if(m[3]) return 30;
    if(m[4]) return cnNum(m[4]);
    return null;
  }
  function guessCat(name){
    if(/会|工作|面试|汇报|客户|报告|加班|邮件|项目|实习|电话/.test(name)) return 'work';
    if(/学|复习|课|作业|读|背|练习|刷题|论文|单词|英语|编程|SQL|Python/i.test(name)) return 'learn';
    if(/跑|健身|游泳|运动|瑜伽|散步|球|骑车|锻炼/.test(name)) return 'exercise';
    if(/地铁|通勤|出门|路上|打车|开车/.test(name)) return 'commute';
    if(/洗澡|护肤|按摩|泡脚/.test(name)) return 'care';
    return 'life';
  }
  function cleanName(clause){
    var s = clause.replace(TIME_RE, '').replace(new RegExp(DUR_RE.source,'g'), '');
    s = s.replace(new RegExp(PERIODS,'g'), '')
      .replace(/今天|明天|待会儿?|等会儿?|一会儿?|帮我|给我|我要|我想|我得|还要|再|然后|之后|以后|加上|添加|增加|安排|插入|插|加|有个|有一个|约了?|改成|换成|一下|一个|一段|个|的|吧|了|呢|啊|到|至|从/g, '')
      .replace(/[，。,.!！?？\s~～—-]/g, '');
    return s.slice(0, 20);
  }
  function findTarget(clause, list, from){
    var best = null, bestScore = 0;
    list.forEach(function(a){
      if(a.cat==='sleep') return;
      var score = 0;
      [a.name, a.group].forEach(function(n){
        (n||'').split(/[、，,（）()\s+]+/).forEach(function(part){
          if(!part) return;
          if(clause.indexOf(part)>=0){ score = Math.max(score, part.length*10); return; }
          for(var i=0;i+2<=part.length;i++){ if(clause.indexOf(part.substr(i,2))>=0) score = Math.max(score, 2); }
        });
      });
      if(!score) return;
      if(!isComplete(a)) score += 1;
      if(toMin(a.end) > from) score += 1;
      if(score > bestScore){ bestScore = score; best = a; }
    });
    return best;
  }
  function localParse(text, list, ctx){
    var ops = [], said = [];
    var wholePeriod = (text.match(new RegExp(PERIODS)) || [])[0] || '';
    text.split(/[，,。；;]|然后|再把|另外/).forEach(function(clause){
      clause = clause.trim();
      if(!clause) return;
      var times = parseTimes(clause), dur = parseDuration(clause);
      if(/重排|重新排|重新安排|没做完|没完成|没做的|补上|往后排/.test(clause)){
        ops.push({op:'replan'}); said.push('把没做完的往后排'); return;
      }
      if(/晚起|起晚|迟到|耽误|推迟|顺延|晚了|拖了|延误/.test(clause)){
        if(dur){
          var op = {op:'delay', minutes:dur};
          if(times.length) op.from = toHHMM(times[0].min);
          ops.push(op); said.push('后面顺延 '+dur+' 分钟');
        }
        return;
      }
      if(/取消|不去|不做|不学|不跑|不练|删掉|删除|去掉|算了|不.{1,4}了/.test(clause)){
        var rt = findTarget(clause, list, ctx.from);
        if(rt){ ops.push({op:'remove', id:rt.id}); said.push('去掉「'+rt.name+'」'); return; }
      }
      if(/挪到|改到|换到|移到|调到|推到|提前到|放到|改在|挪去/.test(clause) && times.length){
        var mt = findTarget(clause, list, ctx.from);
        if(mt){ ops.push({op:'move', id:mt.id, start:toHHMM(times[times.length-1].min)}); said.push('把「'+mt.name+'」挪到 '+toHHMM(times[times.length-1].min)); return; }
      }
      if(/缩短|延长|只要|只学|只做|改成|缩到/.test(clause) && dur && !times.length){
        var zt = findTarget(clause, list, ctx.from);
        if(zt && cleanName(clause).indexOf(zt.name)>=0 || zt && !cleanName(clause)){
          ops.push({op:'resize', id:zt.id, minutes:dur}); said.push('「'+zt.name+'」改成 '+dur+' 分钟'); return;
        }
      }
      // otherwise: something new to add, as long as there's a time or a length to go on
      if(!times.length && !dur) return;
      var name = cleanName(clause) || '新安排';
      var add = {op:'add', name:name, cat:guessCat(name)};
      if(times.length){
        var s = times[0].min;
        var e = times.length>1 && times[1].linked ? times[1].min : s + (dur || 60);
        add.start = toHHMM(s); add.end = toHHMM(Math.min(e, 1440));
        said.push('在 '+rangeText(s, Math.min(e,1440))+' 加「'+name+'」');
      } else {
        add.minutes = dur;
        var p = (clause.match(new RegExp(PERIODS)) || [])[0] || wholePeriod;
        var w = PERIOD_WINDOW[p];
        if(w){ add.after = toHHMM(w[0]); if(w[1]!=null) add.before = toHHMM(w[1]); }
        said.push((p?p+'':'')+'找 '+dur+' 分钟空档加「'+name+'」');
      }
      ops.push(add);
    });
    return {ops:ops, reply: said.length ? '我理解为：'+said.join('；')+'。' : ''};
  }

  // ----- 大模型理解（DeepSeek 中转 / Claude） -----
  function buildPrompt(text, list, ctx){
    var rows = list.map(function(a){
      return a.id+' | '+a.name+' | '+a.start+(a.kind==='point'?'':'–'+a.end)+' | '+a.cat+' | '+(isComplete(a)?'已完成':'未完成');
    }).join('\n');
    return '你是「三三作息簿」的日程助手。用户会用一句中文口语说想怎么改这一天的日程。你只负责把这句话翻译成操作指令，不要自己排时间：时间冲突、顺延、压缩都由程序规则处理。\n\n'+
      '当前时间：'+(ctx.isToday ? toHHMM(ctx.now) : '（查看的不是今天）')+'\n'+
      '这一天的日程（id | 名称 | 时间 | 分类 | 状态）：\n'+rows+'\n\n'+
      '分类键：sleep/wake/life/exercise/learn/work/commute/care（睡眠/苏醒/生活/运动/学习/工作/通勤/护理）\n\n'+
      '可用指令：\n'+
      '{"op":"add","name":"简短名称","cat":"分类键","start":"HH:MM","end":"HH:MM"}  用户说了具体时间\n'+
      '{"op":"add","name":"简短名称","cat":"分类键","minutes":数字,"after":"HH:MM","before":"HH:MM"}  只说了时长；after/before 是大致时段（上午 08:00–12:00，下午 12:00–18:00，晚上 18:00 以后），没说时段就省略\n'+
      '{"op":"move","id":"…","start":"HH:MM"}\n'+
      '{"op":"resize","id":"…","minutes":数字}\n'+
      '{"op":"remove","id":"…"}\n'+
      '{"op":"delay","minutes":数字,"from":"HH:MM"}  "耽误了/晚起了/后面顺延"；from 省略表示从现在开始\n'+
      '{"op":"replan"}  "把没做完的往后排/重新安排一下"\n\n'+
      '要求：\n'+
      '1. 只输出 JSON：{"reply":"一句话告诉用户你理解成了什么","ops":[...]}\n'+
      '2. id 只能从上面的列表里选；找不到对应活动就不要编造\n'+
      '3. 时间一律 24 小时制，"下午三点"=15:00\n'+
      '4. 用户用参照物描述位置时（"睡前""晚饭后""午饭前""下班后"），根据上面的日程推算出具体开始时间，用带 start/end 的 add 或 move；例如"睡前加 20 分钟冥想"就放在睡觉开始前的 20 分钟\n'+
      '5. 听不懂或和日程无关时，ops 返回空数组，并在 reply 里说明\n\n'+
      '用户说：'+text;
  }
  function callLLM(prompt){
    if(AI_ENDPOINT){
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
      return fetch(AI_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({prompt:prompt}), signal: ctrl ? ctrl.signal : undefined
      }).then(function(r){
        clearTimeout(timer);
        if(!r.ok) throw new Error('http_'+r.status);
        return r.json();
      }).then(function(j){ return {data:j.result, source:'DeepSeek'}; });
    }
    if(sampleAPI){
      return sampleAPI.json(prompt, {modelTier:'default'}).then(function(d){ return {data:d, source:'Claude'}; });
    }
    return Promise.reject(new Error('no_llm'));
  }
  // never trust the model's output as-is: only keep well-formed ops that point at real activities
  function validateOps(raw, list){
    if(!raw || !Array.isArray(raw.ops)) return [];
    var ids = {}; list.forEach(function(a){ ids[a.id]=true; });
    var hhmm = function(v){ return typeof v==='string' && /^([01]?\d|2[0-4]):[0-5]\d$/.test(v); };
    var mins = function(v){ return typeof v==='number' && v>0 && v<=720; };
    return raw.ops.filter(function(o){
      if(!o || typeof o.op!=='string') return false;
      if(o.op==='add'){
        if(typeof o.name!=='string' || !o.name.trim()) return false;
        if(!CATS.some(function(c){ return c.key===o.cat; })) o.cat = guessCat(o.name);
        o.name = o.name.trim().slice(0,20);
        if(hhmm(o.start)) return !o.end || hhmm(o.end);
        if(!mins(o.minutes)) return false;
        if(o.after && !hhmm(o.after)) delete o.after;
        if(o.before && !hhmm(o.before)) delete o.before;
        return true;
      }
      if(o.op==='move') return ids[o.id] && hhmm(o.start);
      if(o.op==='resize') return ids[o.id] && mins(o.minutes);
      if(o.op==='remove') return !!ids[o.id];
      if(o.op==='delay') return mins(o.minutes) && (!o.from || hhmm(o.from));
      return o.op==='replan';
    });
  }

  // ----- 规则排程：把指令变成新的一天 -----
  function buildPlan(list, ops, ctx){
    var from = ctx.from, warnings = [], blockers = [];
    var items = list.map(function(a){
      var s = toMin(a.start), e = a.kind==='point' ? s : toMin(a.end);
      var anchor = a.cat==='sleep' || isComplete(a) || s < from; // past / running / done / sleep stay put
      return {a:a, id:a.id, origS:s, origE:e, s:s, e:e, dur:e-s, origDur:e-s, desired:s, anchor:anchor, fixed:false};
    });
    var byId = {}; items.forEach(function(x){ byId[x.id]=x; });
    var live = function(x){ return !x.removed && !x.dropped; };
    var lastSleep = items.filter(function(x){ return x.a.cat==='sleep' && x.origS>=720; })
      .sort(function(p,q){ return q.origS-p.origS; })[0];
    var bed = lastSleep ? lastSleep.origS : 1440;

    function occupied(){
      return items.filter(function(x){ return live(x) && x.dur>0; }).map(function(x){ return [x.s, x.e]; })
        .concat(blockers).sort(function(p,q){ return p[0]-q[0]; });
    }
    function findGap(minutes, lo, hi){
      var t = ceil5(lo);
      var occ = occupied();
      for(var i=0;i<occ.length;i++){
        if(occ[i][1] <= t) continue;
        if(occ[i][0] - t >= minutes && t + minutes <= hi) return t;
        t = Math.max(t, ceil5(occ[i][1]));
      }
      return t + minutes <= hi ? t : null;
    }

    // order matters: free things up first, then shift, then fit in what's new
    var rank = {remove:0, delay:1, replan:1, move:2, resize:2, add:3};
    ops.slice().sort(function(p,q){ return rank[p.op]-rank[q.op]; }).forEach(function(o){
      var x = o.id ? byId[o.id] : null;
      if(o.op==='remove'){
        if(x.anchor && x.s < from) warnings.push('「'+x.a.name+'」已经开始或结束，没有删除。');
        else if(isComplete(x.a)) warnings.push('「'+x.a.name+'」已经打勾完成，没有删除。');
        else x.removed = true;
      } else if(o.op==='delay'){
        var f = o.from ? toMin(o.from) : (ctx.isToday ? from : 0);
        if(!ctx.isToday && !o.from){
          var firstAwake = items.filter(function(y){ return y.a.cat!=='sleep'; }).sort(function(p,q){ return p.origS-q.origS; })[0];
          f = firstAwake ? firstAwake.origS : 0;
        }
        f = Math.max(f, from);
        // whatever is running right now finishes first; the delay starts after it
        if(!o.from) items.forEach(function(y){ if(y.a.cat!=='sleep' && y.dur>0 && y.s < f && y.e > f) f = y.e; });
        // the lost time becomes a blocker; everything after it slides, and free gaps soak it up
        blockers.push([f, f + o.minutes]);
      } else if(o.op==='replan'){
        if(!ctx.isToday){ warnings.push('「没做完的往后排」只对今天有效。'); return; }
        items.forEach(function(y){
          if(y.e <= from && y.dur>0 && !isComplete(y.a) && (y.a.cat==='learn' || y.a.cat==='work')){
            y.anchor = false; y.missed = true; y.desired = from;
          }
        });
      } else if(o.op==='move'){
        if(x.anchor){ warnings.push('「'+x.a.name+'」已经开始、完成或是睡眠时间，没有挪动。'); return; }
        x.desired = x.s = toMin(o.start); x.e = x.s + x.dur; x.fixed = true; x.touched = true;
      } else if(o.op==='resize'){
        if(x.anchor){ warnings.push('「'+x.a.name+'」已经开始或完成，没有改时长。'); return; }
        x.dur = x.origDur = round5(o.minutes); x.e = x.s + x.dur; x.fixed = true; x.touched = true;
      } else if(o.op==='add'){
        var s, e;
        if(o.start){
          s = toMin(o.start); e = o.end ? toMin(o.end) : s + 60;
          if(e < s) e = s;
        } else {
          var lo = Math.max(o.after ? toMin(o.after) : 0, from);
          var hi = Math.min(o.before ? toMin(o.before) : bed, bed);
          s = findGap(o.minutes, lo, hi);
          if(s==null) s = ceil5(lo); // no room: put it at the start of the window and let the rules make room
          e = s + o.minutes;
        }
        var na = {id:uid(), name:o.name, start:toHHMM(s), end:toHHMM(Math.min(e,1440)), cat:o.cat,
                  kind: e===s ? 'point' : 'range', group:'', projectId:'', amount:0, done:false, subs:[]};
        var nx = {a:na, id:na.id, origS:s, origE:e, s:s, e:Math.min(e,1440), dur:Math.min(e,1440)-s, origDur:Math.min(e,1440)-s,
                  desired:s, anchor:false, fixed:true, isNew:true};
        items.push(nx); byId[nx.id] = nx;
        if(s < from) warnings.push('「'+o.name+'」的时间已经过去了，仍按你说的时间加上。');
      }
    });

    function place(){
      var walls = items.filter(function(x){ return live(x) && (x.anchor || x.fixed) && x.dur>0 && x.s < bed; })
        .map(function(x){ return [x.s, x.e]; }).concat(blockers);
      var mov = items.filter(function(x){ return live(x) && !x.anchor && !x.fixed; })
        .sort(function(p,q){ return p.desired-q.desired || p.origS-q.origS; });
      var cursor = from;
      mov.forEach(function(x){
        var st = Math.max(cursor, x.desired), bumped = true, guard = 0;
        while(bumped && guard++ < 60){
          bumped = false;
          walls.forEach(function(w){
            var hit = x.dur>0 ? (st < w[1] && st + x.dur > w[0]) : (st > w[0] && st < w[1]);
            if(hit){ st = w[1]; bumped = true; }
          });
        }
        x.s = st; x.e = st + x.dur; cursor = x.e;
      });
      return mov;
    }
    // the run of back-to-back, pushed activities that ends at `last` — shrinking any of them pulls `last` earlier
    function chainOf(last){
      var all = items.filter(function(x){ return live(x) && x.dur>0; }).sort(function(p,q){ return p.s-q.s; });
      var chain = [last], cur = last;
      while(cur.s > cur.desired || cur.missed){
        var prev = all.filter(function(y){ return y!==cur && y.e===cur.s; })[0];
        if(!prev) break;
        chain.push(prev);
        if(prev.anchor || prev.fixed) break;
        cur = prev;
      }
      return chain.filter(function(y){ return !y.anchor && !y.fixed; });
    }
    for(var guard=0; guard<80; guard++){
      var mov = place();
      var late = mov.filter(function(x){ return x.e > bed || (x.dur===0 && x.s > bed); })
        .sort(function(p,q){ return q.e-p.e; })[0];
      if(!late) break;
      var chain = chainOf(late);
      var over = late.e - bed;
      var squeezable = chain.filter(function(y){
        return y.a.kind!=='point' && y.origDur > 20 && y.dur > Math.max(15, round5(y.origDur*0.5));
      }).sort(function(p,q){ return PRIORITY[p.a.cat]-PRIORITY[q.a.cat] || q.s-p.s; })[0];
      if(squeezable){
        var room = squeezable.dur - Math.max(15, round5(squeezable.origDur*0.5));
        squeezable.dur -= Math.min(room, Math.max(5, ceil5(over)));
        continue;
      }
      var droppable = (chain.length ? chain : [late]).filter(function(y){ return !y.isNew; })
        .sort(function(p,q){ return PRIORITY[p.a.cat]-PRIORITY[q.a.cat] || q.s-p.s; })[0];
      if(!droppable){ warnings.push('睡前放不下所有安排，有一部分会超过 '+toHHMM(bed)+'。'); break; }
      droppable.dropped = true;
    }

    // write the result back as plain activities, carrying sub-items along proportionally
    var newList = [], changes = [];
    items.forEach(function(x){
      var a = x.a;
      if(x.removed){ changes.push({type:'remove', name:a.name, before:[x.origS,x.origE], note:'按你说的去掉'}); return; }
      if(x.dropped){ changes.push({type:'drop', name:a.name, before:[x.origS,x.origE], note:'今天放不下，先移出（重要性较低）'}); return; }
      var s = x.s, e = x.dur>0 ? x.s + x.dur : x.s;
      var k = x.origE>x.origS ? (e-s)/(x.origE-x.origS) : 1;
      var subs = (a.subs||[]).map(function(sb){
        var ss = s + round5((toMin(sb.start)-x.origS)*k), se = s + round5((toMin(sb.end)-x.origS)*k);
        return {id:sb.id, name:sb.name, start:toHHMM(Math.min(ss,1440)), end:toHHMM(Math.min(se,e,1440)), done:!!sb.done};
      });
      var na = {id:a.id, name:a.name, start:toHHMM(s), end:toHHMM(Math.min(e,1440)), cat:a.cat, kind:a.kind||'range',
                group:a.group||'', projectId:a.projectId||'', amount:a.amount||0, done:!!a.done, subs:subs};
      newList.push(na);
      if(x.isNew) changes.push({type:'add', name:a.name, after:[s,e], id:a.id});
      else if(s!==x.origS || e!==x.origE){
        var shrunk = (e-s) < (x.origE-x.origS);
        var note = x.missed ? '之前没做完，补到现在之后' : (x.touched ? '按你说的调整' : (shrunk ? '压缩时长，给前面的安排让位' : '顺延'));
        changes.push({type: shrunk && !x.touched ? 'shrink' : 'move', name:a.name, before:[x.origS,x.origE], after:[s,e], note:note, id:a.id});
      }
    });
    newList.sort(function(p,q){ return toMin(p.start)-toMin(q.start); });
    var order = {add:0, move:1, shrink:2, remove:3, drop:4};
    changes.sort(function(p,q){ return order[p.type]-order[q.type] || (p.after||p.before)[0]-(q.after||q.before)[0]; });
    // a new fixed item can still land on something that was already running — say so instead of hiding it
    items.forEach(function(x){
      if(!x.isNew || x.removed) return;
      items.forEach(function(y){
        if(y===x || !live(y) || !y.anchor || y.a.cat==='sleep' || y.dur===0) return;
        if(x.s < y.e && y.s < x.e) warnings.push('「'+x.a.name+'」和「'+y.a.name+'」时间重叠（后者已经开始或完成，没有挪动）。');
      });
    });
    return {list:newList, changes:changes, warnings:warnings, bed:bed};
  }

  // ----- 交互 -----
  function aiStatus(msg, isError){
    var el = $('aiStatus');
    if(!msg){ el.hidden = true; return; }
    el.textContent = msg; el.className = 'ai-status'+(isError?' error':''); el.hidden = false;
  }
  function cnHour(h){
    var n = ['零','一','两','三','四','五','六','七','八','九','十','十一','十二'];
    var p = h<12 ? '上午' : (h===12 ? '中午' : (h<18 ? '下午' : '晚上'));
    return {p:p, n:n[h>12 ? h-12 : h]};
  }
  function renderAiChips(){
    var chips = [];
    if(isViewingToday()){
      var h = new Date().getHours()+1;
      if(h>=8 && h<=20){

        chips.push(a.p+a.n+'点到'+(a.p===b.p?'':b.p)+b.n+'点加一个组会');
      } else {
        chips.push('加一个半小时复习');
      }
      chips.push('耽误了40分钟，后面都顺延');
    } else {
